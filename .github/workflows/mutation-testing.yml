name: Mutation Testing with PIT

on:
  workflow_dispatch:

jobs:
  mutation-testing:
    env:
      DISPLAY: :1

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Set up JDK 17
      uses: actions/setup-java@v6.0.1
      with:
        java-version: 17
        distribution: temurin
    - name: Cache Maven packages
      uses: actions/cache@v6
      with:
        path: |
          ~/.m2
        key: ${{ runner.os }}-pit-${{ hashFiles('**/pom.xml', '**/*.target') }}
        restore-keys: ${{ runner.os }}-pit-
    - name: Start Xvfb
      run: |
        Xvfb :1 &
    - name: Run mutation testing with PIT
      run: >
        ./mvnw compile -Prcp-build,mutation-testing
        -f releng/org.eclipse.emf.parsley.parent
        -pl :org.eclipse.emf.parsley.tests -am
        -Djgit.dirtyWorkingTree=ignore -Dtycho.localArtifacts=ignore
        org.pitest:pitest-maven:mutationCoverage
    - name: Upload PIT report
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: pit-report-${{ runner.os }}
        path: '**/pit-reports/**'
